name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.9.4
      - run: ruff check api/
      - run: ruff format --check api/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: planyourmeals_test
          POSTGRES_USER: planyourmeals
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planyourmeals"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      DB_NAME: planyourmeals_test
      DB_USER: planyourmeals
      DB_PASSWORD: testpass
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y coinor-cbc libpq-dev
      - name: Install Python dependencies
        working-directory: api
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: api
        run: pytest -v
