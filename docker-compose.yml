services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: planyourmeals
      POSTGRES_USER: planyourmeals
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planyourmeals"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
